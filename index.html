<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Number(n).toLocaleString('en-US');
const MISSIONS=[{id:'m1',name:'The First Drop',area:'Vespucci Beach',desc:'Make a timed delivery across the coast.',reward:1250,level:'EASY'},{id:'m2',name:'Night Shift',area:'Downtown',desc:'Handle a late-night courier assignment.',reward:2300,level:'MEDIUM'},{id:'m3',name:'The Grand Route',area:'Vinewood Hills',desc:'Plan a perfect cross-city route.',reward:5000,level:'HARD'},{id:'m4',name:'High Stakes',area:'Port of LS',desc:'Complete a risky logistical contract.',reward:8900,level:'EXPERT'}];
const CARS=[{id:'Comet S',name:'Comet S',type:'SPORT',price:0,emoji:'🏎️',color:'#82d6e7'},{id:'Nighthawk GT',name:'Nighthawk GT',type:'SUPERCAR',price:5800,emoji:'🏎️',color:'#f76286'},{id:'Sandstorm XR',name:'Sandstorm XR',type:'OFFROAD',price:7400,emoji:'🚙',color:'#f0bb56'},{id:'Shadow Cruiser',name:'Shadow Cruiser',type:'MUSCLE',price:9200,emoji:'🚘',color:'#ad93ed'}];
const APPS=[{id:'missions',name:'Missions',icon:'★',glow:'#a3dc59'},{id:'garage',name:'Garage',icon:'🏎',glow:'#d95673'},{id:'map',name:'City Map',icon:'⌖',glow:'#4f9eea'},{id:'phone',name:'Phone',icon:'☎',glow:'#39b59d'},{id:'files',name:'Files',icon:'▣',glow:'#b38add'},{id:'terminal',name:'Terminal',icon:'>_',glow:'#4e7364'},{id:'notes',name:'Notes',icon:'✎',glow:'#ecad5b'},{id:'radio',name:'Radio',icon:'♫',glow:'#df5c9a'},{id:'browser',name:'City Web',icon:'◉',glow:'#5889eb'},{id:'settings',name:'Settings',icon:'⚙',glow:'#5e677d'}];
const COLORS={lime:['#b3ff57','179,255,87'],pink:['#ff82b2','255,130,178'],blue:['#76ceff','118,206,255'],orange:['#ffbf6a','255,191,106']};
const DEFAULT={cash:12500,missions:{},owned:['Comet S'],car:'Comet S',theme:'lime',wallpaper:'dusk',note:'WELCOME TO V I C E S T R E E T  O S\n\nYour city. Your rules.\n\nThings to try:\n• Complete a mission to earn cash.\n• Buy a car in the Garage.\n• Type help in Terminal.\n• Create a file in Files.\n• Change the theme in Settings.\n\nAll progress saves locally in this browser.',files:[{name:'README.txt',content:'VICESTREET OS v1.0\n\nA GTA V-inspired interactive desktop experience. This is a browser-based OS simulator, not a standalone operating system.\n\nMade for creative learning, with original artwork. No Rockstar assets included.'},{name:'mission-brief.txt',content:'Mission Brief\nExplore the city, earn rewards and upgrade your garage.'}],messages:{Lamar:[{mine:false,text:'Yo! The city is looking good today. Check the mission board.'}],Mechanic:[{mine:false,text:'Your ride is ready. Open the Garage to see it.'}],Dispatch:[{mine:false,text:'New contracts are live. Earn some cash out there.'}]},contact:'Lamar',radioStation:0};
let state;try{state={...structuredClone(DEFAULT),...JSON.parse(localStorage.getItem('vicestreet-os-v1')||'{}')}}catch(e){state=structuredClone(DEFAULT)};
const save=()=>{try{localStorage.setItem('vicestreet-os-v1',JSON.stringify(state))}catch(e){}};
const appMap=Object.fromEntries(APPS.map(a=>[a.id,a]));const windows=new Map();let z=102,offset=0,editingFile=0,terminalHistory=[],termIndex=0,radio={context:null,interval:null,nodes:[],step:0,playing:false,volume:.18};
function theme(){const [c,r]=COLORS[state.theme]||COLORS.lime;document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-rgb',r);$('#desktop').className=state.wallpaper==='dusk'?'':state.wallpaper;save()}theme();
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),3600)}
function clock(){const d=new Date();$('#topClock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#barTime').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('#barDate').textContent=d.toLocaleDateString([],{month:'short',day:'numeric'}).toUpperCase()};clock();setInterval(clock,30000);
function renderIcons(){const icons=APPS.filter(a=>a.id!=='settings').map(a=>`<button class="desk-icon" data-open="${a.id}" title="Open ${esc(a.name)}"><span class="app-glyph" style="--glow:${a.glow}">${a.icon}</span><span>${esc(a.name)}</span></button>`).join('');$('#desktopIcons').innerHTML=icons;renderStart();renderPinned()}
function renderStart(query=''){const apps=APPS.filter(a=>a.name.toLowerCase().includes(query.toLowerCase()));$('#startApps').innerHTML=apps.length?apps.map(a=>`<button class="start-app" data-open="${a.id}"><span>${a.icon}</span>${esc(a.name)}</button>`).join(''):'<div class="muted">No apps found.</div>'}
function renderPinned(){const pins=['missions','garage','map','phone','files','terminal','settings'];$('#pinned').innerHTML=pins.map(id=>{const a=appMap[id];return `<button class="taskbar-btn ${windows.has(id)?'running':''}" data-toggle="${id}" title="${esc(a.name)}">${a.icon}</button>`}).join('')}
function toggleStart(force){const el=$('#startMenu');const show=force===undefined?!el.classList.contains('show'):force;el.classList.toggle('show',show);if(show){$('#startSearch').value='';renderStart();$('#startSearch').focus()}}
function renderWidget(){const count=MISSIONS.filter(m=>state.missions[m.id]==='done').length;const next=MISSIONS.find(m=>state.missions[m.id]!=='done');$('#missionWidget').innerHTML=`<div class="widget-head"><span>★ &nbsp; LATEST CONTRACT</span><span class="pill">${next?'AVAILABLE':'COMPLETE'}</span></div><h3>${next?esc(next.name):'ALL CLEAR'}</h3><p>${next?esc(next.desc):'Every contract completed. Own the city.'}</p><div class="rewards"><span>REWARD <strong>${next?fmt(next.reward):'—'}</strong></span><span>${count}/${MISSIONS.length} COMPLETE</span></div><button class="button" data-open="missions" style="width:100%;margin-top:17px">VIEW MISSIONS →</button>`}
function focusWin(id){for(const [name,w] of windows){w.classList.toggle('focused',name===id)}const w=windows.get(id);if(w){w.style.zIndex=++z;w.classList.remove('minimized')}renderPinned()}
function minimize(id){const w=windows.get(id);if(w){w.classList.add('minimized');w.classList.remove('focused');renderPinned()}}
function maximize(id){const w=windows.get(id);if(w){w.classList.toggle('maximized');focusWin(id)}}
function closeWin(id){const w=windows.get(id);if(!w)return;if(id==='radio')stopRadio();w.remove();windows.delete(id);renderPinned()}
function openApp(id){if(!appMap[id])return;toggleStart(false);if(windows.has(id)){focusWin(id);return}const a=appMap[id];const win=document.createElement('section');win.className='window focused';win.dataset.app=id;win.style.left=(100+(offset*34)%240)+'px';win.style.top=(35+(offset*28)%130)+'px';win.style.zIndex=++z;offset++;win.innerHTML=`<header class="window-bar"><div class="window-title"><b>${a.icon}</b>${esc(a.name.toUpperCase())}<span style="font-size:10px;color:#6f7380">// V.1</span></div><div class="win-controls"><button class="win-control" data-minimize="${id}" title="Minimize">─</button><button class="win-control" data-maximize="${id}" title="Maximize">□</button><button class="win-control close" data-close="${id}" title="Close">×</button></div></header><div class="window-body"></div>`;$('#windows').append(win);windows.set(id,win);for(const [name,w] of windows)w.classList.toggle('focused',name===id);renderApp(id);renderPinned();win.addEventListener('pointerdown',()=>focusWin(id));setupDrag(win);if(id==='terminal')win.querySelector('.terminal-prompt input')?.focus()}
function setupDrag(win){const bar=win.querySelector('.window-bar');let drag=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||win.classList.contains('maximized'))return;drag={x:e.clientX,y:e.clientY,l:win.offsetLeft,t:win.offsetTop};bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag)return;const area=$('#windows');const l=Math.min(Math.max(-win.offsetWidth+110,drag.l+e.clientX-drag.x),area.clientWidth-90);const t=Math.min(Math.max(0,drag.t+e.clientY-drag.y),area.clientHeight-45);win.style.left=l+'px';win.style.top=t+'px'});const end=()=>drag=null;bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);bar.addEventListener('dblclick',e=>{if(!e.target.closest('button'))maximize(win.dataset.app)})}
function setBody(id,html,pad0=false){const w=windows.get(id);if(!w)return;const b=w.querySelector('.window-body');b.classList.toggle('pad0',pad0);b.innerHTML=html}
function renderApp(id){({missions:renderMissions,garage:renderGarage,map:renderMap,phone:renderPhone,files:renderFiles,terminal:renderTerminal,notes:renderNotes,radio:renderRadio,browser:renderBrowser,settings:renderSettings})[id]?.()}
function renderMissions(){const done=MISSIONS.filter(m=>state.missions[m.id]==='done').length;setBody('missions',`<div class="spread"><div><p class="subhead">LOS SANTOS // CONTRACT NETWORK</p><h2 class="section-title">MISSION CONTROL</h2><p class="muted">Choose a simulated contract to progress and earn rewards.</p></div><div style="text-align:right"><div class="wallet">${fmt(state.cash)}</div><div class="muted">AVAILABLE CASH</div></div></div><div class="grid3" style="margin:18px 0"><div class="panel"><div class="stat">${done}/${MISSIONS.length}</div><div class="muted">MISSIONS COMPLETE</div></div><div class="panel"><div class="stat">${MISSIONS.filter(m=>state.missions[m.id]==='active').length}</div><div class="muted">ACTIVE CONTRACTS</div></div><div class="panel"><div class="stat">${Math.round(done/MISSIONS.length*100)}%</div><div class="muted">CITY PROGRESS</div></div></div><p class="subhead">AVAILABLE CONTRACTS</p>`+MISSIONS.map(m=>{const status=state.missions[m.id];return `<div class="mission-card"><div class="info"><span class="tag">${m.level} • ${esc(m.area)}</span><h4>${esc(m.name)}</h4><p>${esc(m.desc)}</p></div><div class="right"><b>+${fmt(m.reward)}</b><button class="button ${status==='done'?'secondary':''}" data-mission="${m.id}" ${status==='done'?'disabled':''}>${status==='done'?'✓ COMPLETED':status==='active'?'COMPLETE':'ACCEPT'}</button></div></div>`}).join(''))}
function actionMission(id){const m=MISSIONS.find(x=>x.id===id);if(!m)return;if(!state.missions[id]){state.missions[id]='active';toast('Contract accepted: '+m.name)}else if(state.missions[id]==='active'){state.missions[id]='done';state.cash+=m.reward;toast('Mission complete! +'+fmt(m.reward));renderWidget();if(windows.has('garage'))renderGarage()}save();renderMissions()}
function renderGarage(){setBody('garage',`<div class="spread"><div><p class="subhead">LOS SANTOS CUSTOMS // VEHICLE COLLECTION</p><h2 class="section-title">YOUR GARAGE</h2><p class="muted">Purchase and select vehicles with your mission earnings.</p></div><div style="text-align:right"><div class="wallet">${fmt(state.cash)}</div><div class="muted">BANK BALANCE</div></div></div><div class="grid2" style="margin-top:20px">`+CARS.map(c=>{const owned=state.owned.includes(c.id),sel=state.car===c.id;return `<div class="panel"><div class="car-art" style="--car:${c.color}"><span>${c.emoji}</span></div><div class="spread"><div><div class="car-name">${esc(c.name)}</div><div class="car-meta">${c.type}</div></div>${sel?'<span class="tag">ACTIVE RIDE</span>':''}</div><div class="car-actions"><b>${owned?'OWNED':fmt(c.price)}</b><button class="button ${sel?'secondary':''}" data-car="${esc(c.id)}" ${sel?'disabled':''}>${sel?'SELECTED':owned?'SELECT':'BUY NOW'}</button></div></div>`}).join('')+'</div>')}
function actionCar(id){const c=CARS.find(x=>x.id===id);if(!c)return;if(!state.owned.includes(id)){if(state.cash<c.price)return toast('Not enough cash. Complete a mission first.');state.cash-=c.price;state.owned.push(id);toast(c.name+' purchased!')}state.car=id;save();renderGarage();if(windows.has('missions'))renderMissions()}
const MAP_POS=[{x:28,y:28,name:'Vinewood Hills',note:'Expensive homes and winding hill roads.',emoji:'★'},{x:64,y:23,name:'Downtown',note:'Skyscrapers and business contracts.',emoji:'▣'},{x:32,y:68,name:'Vespucci Beach',note:'Sunset coastline and side streets.',emoji:'☀'},{x:77,y:72,name:'Port of LS',note:'Freight terminals and logistics routes.',emoji:'⚓'},{x:51,y:54,name:'Los Santos Customs',note:'Your home garage and vehicle upgrades.',emoji:'🏎'}];let selectedMap=4;
function renderMap(){const m=MAP_POS[selectedMap];setBody('map',`<div class="map-box"><svg viewBox="0 0 720 480" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 Q230 120 200 200 T0 470" fill="#287280" opacity=".75"/><path d="M430 0 Q350 90 450 230 T720 370" stroke="#607579" fill="none" stroke-width="25" opacity=".35"/><path d="M0 150 L720 430 M0 280 L720 110 M115 0 L475 480 M460 0 L170 480 M0 405 L720 270" stroke="#9aa5a1" fill="none" stroke-width="13" opacity=".29"/><path d="M0 150 L720 430 M0 280 L720 110 M115 0 L475 480 M460 0 L170 480 M0 405 L720 270" stroke="#1d313c" fill="none" stroke-width="8" opacity=".85"/><path d="M0 20 L720 300 M180 0 L540 480 M720 50 L0 380 M720 160 L80 480 M0 380 L700 0" stroke="#8ea49c" fill="none" stroke-width="4" opacity=".35"/><g fill="#b7c7ac" opacity=".42"><rect x="240" y="68" width="60" height="32" rx="5"/><rect x="460" y="260" width="110" height="41" rx="3"/><rect x="283" y="307" width="75" height="55" rx="5"/><rect x="550" y="73" width="45" height="50" rx="5"/></g><text x="18" y="460" fill="#d0e2e0" font-size="14" letter-spacing="3" opacity=".7">LOS SANTOS / LIVE CITY MAP</text></svg>`+MAP_POS.map((x,i)=>`<button class="map-mark" style="left:${x.x}%;top:${x.y}%;${i===selectedMap?'outline:4px solid #ffffff35;':''}" data-map="${i}" title="${esc(x.name)}">${x.emoji}</button>`).join('')+`<div class="map-detail"><div class="subhead">SELECTED LOCATION</div><b>${esc(m.name)}</b><div class="muted">${esc(m.note)}</div></div></div>`,true)}
function renderPhone(){const contact=state.contact||'Lamar',msgs=state.messages?.[contact]||[];setBody('phone',`<div class="phone-shell"><div class="phone-notch"></div><div class="spread" style="margin-bottom:14px"><b style="font-size:22px;font-family:Impact,sans-serif">iFRUIT <span style="color:var(--accent)">MESSAGES</span></b><span class="tag">SIMULATED</span></div><div class="contacts">`+['Lamar','Mechanic','Dispatch'].map(n=>`<button class="contact ${contact===n?'selected':''}" data-contact="${n}">${n}</button>`).join('')+`</div><div class="chat-bubbles" id="chatBubbles">`+msgs.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')+`</div><form id="chatForm" class="chat-form"><input id="chatInput" class="field" maxlength="250" placeholder="Message ${esc(contact)}..." required autocomplete="off"><button type="submit" class="button">➤</button></form></div>`,false);const b=$('#chatBubbles');if(b)b.scrollTop=b.scrollHeight}
function sendChat(text){const contact=state.contact;const replies={Lamar:'Word. Keep hustling out there!',Mechanic:'Copy that. Your ride is still looking sharp.',Dispatch:'Message received. Check Mission Control for updates.'};state.messages[contact]??=[];state.messages[contact].push({mine:true,text});state.messages[contact].push({mine:false,text:replies[contact]});save();renderPhone()}
function renderFiles(){const curr=state.files[editingFile]||state.files[0];setBody('files',`<div class="files-layout"><aside class="files-side"><div class="subhead">THIS PC</div><div class="muted">▣ Documents</div><div class="muted" style="margin-top:14px">▣ My City</div><hr class="line"><div class="muted">Local files only</div></aside><div class="files-content"><div class="spread"><div><h2 class="section-title">FILES</h2><div class="muted">Saved in your browser</div></div><button class="button" data-newfile="1">+ NEW FILE</button></div><div style="margin-top:15px">`+state.files.map((f,i)=>`<button class="file-row ${editingFile===i?'selected':''}" data-file="${i}"><span>📄 &nbsp;${esc(f.name)}</span><span>›</span></button>`).join('')+`</div><div class="line"></div><div class="spread" style="margin-bottom:10px"><b style="font-size:13px">${esc(curr?.name||'No file')}</b><button class="mini-link" data-deletefile="1">Delete</button></div><textarea id="fileContent" class="file-edit" spellcheck="false">${esc(curr?.content||'')}</textarea><div class="spread" style="margin-top:10px"><span class="muted">Changes save when you press Save</span><button class="button" data-savefile="1">SAVE FILE</button></div></div></div>`,true)}
function renderTerminal(){setBody('terminal',`<div class="terminal"><div id="terminalOutput" class="terminal-output"><span class="cmd-good">VICESTREET OS // TERMINAL V1.0</span>\nWELCOME, PLAYER 01. TYPE 'help' FOR AVAILABLE COMMANDS.\n\n</div><div class="terminal-prompt"><label for="terminalInput">player@los-santos:~$</label><input id="terminalInput" autocomplete="off" spellcheck="false"></div></div>`,true)}
function termPrint(content,cls=''){const o=windows.get('terminal')?.querySelector('#terminalOutput');if(!o)return;const s=document.createElement('span');s.className=cls;s.textContent=content;o.append(s);o.scrollTop=o.scrollHeight}
function termCommand(raw){const [cmd,...args]=raw.trim().split(/\s+/);if(!cmd)return;terminalHistory.push(raw);termIndex=terminalHistory.length;termPrint('player@los-santos:~$ '+raw+'\n','cmd-good');let output='',cls='';switch(cmd.toLowerCase()){
case 'help':output='COMMANDS: help, about, whoami, date, balance, missions, cars, ls, cat <name>, echo <text>, clear, neofetch, open <app>, theme <lime|pink|blue|orange>, reboot';break;
case 'about':output='ViceStreet OS — GTA V-inspired browser desktop simulator. Not a real bootable operating system.';break;
case 'whoami':output='player01 / Los Santos citizen';break;
case 'date':output=new Date().toString();break;
case 'balance':output='Available balance: '+fmt(state.cash);break;
case 'missions':output=MISSIONS.map(m=>m.name+' — '+(state.missions[m.id]||'available')).join('\n');break;
case 'cars':output='Selected: '+state.car+'\nOwned: '+state.owned.join(', ');break;
case 'ls':output=state.files.map(f=>f.name).join('   ');break;
case 'cat':{const f=state.files.find(f=>f.name.toLowerCase()===args.join(' ').toLowerCase());output=f?f.content:'File not found.';break}
case 'echo':output=args.join(' ');break;
case 'clear':{const o=windows.get('terminal')?.querySelector('#terminalOutput');if(o)o.textContent='';return}
case 'neofetch':output='      VICESTREET OS\n  --------------------------\n  User: player01\n  District: Los Santos\n  Shell: City Terminal 1.0\n  Engine: HTML / CSS / JS\n  Storage: localStorage\n  Status: ONLINE';break;
case 'open':{const app=APPS.find(a=>a.id===args[0]||a.name.toLowerCase()===args.join(' ').toLowerCase());if(app){openApp(app.id);output='Opening '+app.name+'...'}else{output='Unknown app. Try open missions';cls='cmd-error'}break}
case 'theme':if(COLORS[args[0]]){state.theme=args[0];theme();output='Theme set: '+args[0]}else{output='Try theme lime, pink, blue, or orange';cls='cmd-error'}break;
case 'reboot':output='Rebooting UI...';setTimeout(lockScreen,200);break;
default:output='Command not found: '+cmd+'. Type help.';cls='cmd-error'}termPrint(output+'\n\n',cls)}
function renderNotes(){setBody('notes',`<p class="subhead">PERSONAL SPACE // AUTOSAVE ON</p><div class="spread"><h2 class="section-title" style="margin-bottom:10px">MY NOTES</h2><span class="tag" id="noteStatus">ALL CHANGES SAVED</span></div><textarea class="note-area" id="noteInput" placeholder="Write something here..." spellcheck="false">${esc(state.note)}</textarea>`)}
const STATIONS=[{name:'Vinewood Nights',sub:'LO-FI ELECTRONIC',freq:220},{name:'Pacific Drive',sub:'RETRO SYNTH',freq:165},{name:'Downtown FM',sub:'CITY PULSE',freq:130}];
function renderRadio(){const s=STATIONS[state.radioStation]||STATIONS[0];setBody('radio',`<p class="subhead">LIVE FROM LOS SANTOS // ORIGINAL SYNTH AUDIO</p><h2 class="section-title">CITY RADIO</h2><p class="muted">Generative instrumental sounds. No streamed or copyrighted tracks.</p><div class="radio-hero ${radio.playing?'playing':''}" style="margin:17px 0"><div class="radio-disc"></div></div><div class="spread radiometa"><div><div class="subhead">NOW TUNED TO</div><h3 style="margin:0">${s.name}</h3><div class="muted">${s.sub}</div></div><div class="visual-bars">`+Array.from({length:8},(_,i)=>`<i style="--i:${i}"></i>`).join('')+`</div></div><div class="spread" style="margin-top:18px"><button class="button secondary" data-radio-prev="1">⏮ STATION</button><button class="button" data-radio-play="1">${radio.playing?'❚❚ PAUSE':'▶ PLAY'}</button><button class="button secondary" data-radio-next="1">STATION ⏭</button></div><div class="spread" style="margin-top:19px"><span class="muted">VOLUME</span><input id="radioVolume" class="radio-volume" type="range" min="0" max="0.4" step="0.01" value="${radio.volume}"></div>`)}
function playNote(f,duration=0.18){try{if(!radio.context)return;const ctx=radio.context;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,ctx.currentTime);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,radio.volume*.13),ctx.currentTime+.025);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration+.02)}catch(e){}}
function startRadio(){if(radio.playing)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx){toast('Audio is not available in this browser');return}radio.context??=new Ctx();radio.context.resume();radio.playing=true;radio.step=0;radio.interval=setInterval(()=>{const s=STATIONS[state.radioStation];const notes=[1,1.5,1.25,1.78,1.25,1.5,2,1.33];playNote(s.freq*notes[radio.step%notes.length],.29);radio.step++},320);renderRadio()}catch(e){toast('Unable to start audio')}}
function stopRadio(){if(radio.interval){clearInterval(radio.interval);radio.interval=null}radio.playing=false;if(radio.context){radio.context.suspend().catch(()=>{})}if(windows.has('radio'))renderRadio()}
let browserTab='news';
function renderBrowser(){const news=[['CITY NEWS','Downtown Lights Return for the Weekend','The skyline is glowing as local businesses prepare for a busy Friday.'],['MOTOR WATCH','Four Vehicles to Rule the Streets','Browse the garage and discover a ride that fits your style.'],['COMMUNITY','Fresh Contracts Posted on Mission Control','Explore the latest simulated contracts and earn city credits.']];setBody('browser',`<div class="browser-tabs"><button data-browser="news" class="${browserTab==='news'?'selected':''}">LS NEWS</button><button data-browser="market" class="${browserTab==='market'?'selected':''}">MARKETPLACE</button><button data-browser="help" class="${browserTab==='help'?'selected':''}">GUIDE</button><span class="muted" style="align-self:center;margin-left:auto">OFFLINE CITY WEB</span></div><div class="browser-article">${browserTab==='news'?`<p class="subhead">LOS SANTOS // DAILY DISPATCH</p><h2>THE CITY NEVER SLEEPS<span style="color:var(--accent)">.</span></h2><div class="muted">Fictional local updates inside your desktop.</div>`+news.map(n=>`<article class="news-card"><div class="subhead">${n[0]}</div><h3>${n[1]}</h3><p>${n[2]}</p></article>`).join(''):browserTab==='market'?`<p class="subhead">LS CUSTOMS // MARKETPLACE</p><h2>FIND YOUR NEXT RIDE.</h2><p class="muted">Your digital city marketplace connects to the Garage app.</p><div class="panel spread" style="margin-top:19px"><div><b>FEATURED: Nighthawk GT</b><p class="muted">Premium speed for your city adventures.</p></div><button class="button" data-open="garage">VIEW GARAGE</button></div>`:`<p class="subhead">VICESTREET OS // HOW TO PLAY</p><h2>WELCOME TO THE CITY.</h2><p class="muted">Open apps by double-clicking desktop icons or by using the start menu. Run missions to earn fictional money, buy cars, write notes, use files and explore the interactive map. Data remains on this browser. This is a desktop simulator, not a real OS or an actual GTA game.</p><button class="button" data-open="terminal" style="margin-top:17px">TRY THE TERMINAL</button>`}</div>`,true)}
function renderSettings(){setBody('settings',`<p class="subhead">SYSTEM PREFERENCES // PERSONALIZE THE CITY</p><h2 class="section-title">SETTINGS</h2><p class="muted">Choose your style. All settings save automatically.</p><hr class="line"><div class="settings-row"><div><b>Accent color</b><div class="muted">Change buttons and highlights</div></div><div class="colors">`+Object.entries(COLORS).map(([name,[color]])=>`<button class="color-choice ${state.theme===name?'chosen':''}" style="--swatch:${color}" data-theme="${name}" title="${name}"></button>`).join('')+`</div></div><div style="margin:17px 0"><b style="font-size:13px">Wallpaper mode</b><div class="muted">Select your city backdrop</div><div class="wallpapers">`+[['dusk','SUNSET','linear-gradient(150deg,#30224f,#ef9a8a)'],['night','MIDNIGHT','linear-gradient(150deg,#090d24,#5c3a66)'],['ocean','PACIFIC','linear-gradient(150deg,#10283c,#43a5ac)']].map(([id,name,color])=>`<button class="wallpaper-choice ${state.wallpaper===id?'chosen':''}" style="--wall:${color}" data-wall="${id}">${name}</button>`).join('')+`</div></div><hr class="line"><div class="settings-row"><div><b>Desktop edition</b><div class="muted">ViceStreet OS 1.0 • Offline ready</div></div><span class="tag">CITY EDITION</span></div><div class="settings-row"><div><b>Clear saved progress</b><div class="muted">Reset money, cars, missions, files, and notes</div></div><button class="button danger" data-reset="1">RESET DATA</button></div><p class="muted" style="margin-top:22px">Unofficial GTA V-inspired fan concept, not affiliated with Rockstar Games. It runs as a webpage and cannot replace Windows or boot your PC.</p>`)}
function lockScreen(){toggleStart(false);stopRadio();for(const id of [...windows.keys()])closeWin(id);$('#boot').classList.add('power-view');$('#boot').style.display='flex';$('#boot').style.opacity='1'}
function unlock(){const boot=$('#boot');boot.style.opacity='0';setTimeout(()=>{boot.style.display='none';boot.classList.remove('power-view')},450)}
// Global click handling for apps, windows and app commands.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.open){openApp(d.open);return}
if(d.toggle){const id=d.toggle;if(windows.has(id)&&!windows.get(id).classList.contains('minimized')&&windows.get(id).classList.contains('focused'))minimize(id);else openApp(id);return}
if(d.minimize){minimize(d.minimize);return}if(d.maximize){maximize(d.maximize);return}if(d.close){closeWin(d.close);return}
if(d.mission){actionMission(d.mission);return}if(d.car){actionCar(d.car);return}
if(d.map!==undefined){selectedMap=Number(d.map);renderMap();return}
if(d.contact){state.contact=d.contact;save();renderPhone();return}
if(d.file!==undefined){editingFile=Number(d.file);renderFiles();return}
if(d.newfile){const name=prompt('Name your text file (example: ideas.txt)');if(name===null)return;const clean=name.trim().replace(/[\\/<>:"|?*]/g,'').slice(0,55);if(!clean)return toast('File name cannot be empty');if(state.files.some(f=>f.name.toLowerCase()===clean.toLowerCase()))return toast('A file with that name exists');state.files.push({name:clean,content:''});editingFile=state.files.length-1;save();renderFiles();toast('File created');return}
if(d.savefile){if(!state.files[editingFile])return;state.files[editingFile].content=windows.get('files')?.querySelector('#fileContent')?.value||'';save();toast('File saved');return}
if(d.deletefile){if(!state.files[editingFile])return;if(!confirm('Delete this file?'))return;state.files.splice(editingFile,1);if(!state.files.length)state.files.push({name:'new.txt',content:''});editingFile=0;save();renderFiles();toast('File deleted');return}
if(d.theme){state.theme=d.theme;theme();renderSettings();return}if(d.wall){state.wallpaper=d.wall;theme();renderSettings();return}
if(d.reset){if(!confirm('Reset all saved ViceStreet OS progress?'))return;state=structuredClone(DEFAULT);editingFile=0;theme();for(const id of windows.keys())if(id!=='settings')renderApp(id);renderSettings();renderWidget();toast('Desktop data reset');return}
if(d.browser){browserTab=d.browser;renderBrowser();return}
if(d.radioPlay){radio.playing?stopRadio():startRadio();return}if(d.radioPrev||d.radioNext){state.radioStation=(state.radioStation+(d.radioNext?1:-1)+STATIONS.length)%STATIONS.length;save();renderRadio();return}
});
$('#startBtn').addEventListener('click',()=>toggleStart());$('#searchBtn').addEventListener('click',()=>toggleStart(true));$('#startSearch').addEventListener('input',e=>renderStart(e.target.value));$('#powerBtn').addEventListener('click',lockScreen);$('#unlockBtn').addEventListener('click',unlock);
document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const input=e.target.querySelector('input');const msg=input.value.trim();if(msg)sendChat(msg)}});
document.addEventListener('input',e=>{if(e.target.id==='noteInput'){state.note=e.target.value;save()}if(e.target.id==='radioVolume'){radio.volume=Number(e.target.value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleStart(false);if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='t'){e.preventDefault();openApp('terminal')}if(e.ctrlKey&&e.code==='Space'){e.preventDefault();toggleStart()}if(e.target.id==='terminalInput'){if(e.key==='Enter'){const v=e.target.value;e.target.value='';termCommand(v)}if(e.key==='ArrowUp'){e.preventDefault();termIndex=Math.max(0,termIndex-1);e.target.value=terminalHistory[termIndex]||''}if(e.key==='ArrowDown'){e.preventDefault();termIndex=Math.min(terminalHistory.length,termIndex+1);e.target.value=terminalHistory[termIndex]||''}}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#startMenu,#startBtn,#searchBtn'))toggleStart(false)});
renderIcons();renderWidget();setTimeout(()=>unlock(),1700);
window.ViceStreetOS={openApp,state:()=>structuredClone(state),listApps:()=>APPS.map(a=>a.id),version:'1.0'};
})();
